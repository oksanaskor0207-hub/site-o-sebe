<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d72ff"/>
      <stop offset="1" stop-color="#5a3de0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7fd6"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- орбита -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#orbit)" stroke-width="2.4" opacity="0.9"/>
  <!-- спутник на орбите -->
  <circle cx="56.5" cy="19" r="3.6" fill="#3f7fd6"/>

  <!-- астра: 8 лепестков -->
  <g fill="url(#petal)">
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(45 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(90 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(135 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(180 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(225 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(270 32 32)"/>
    <ellipse cx="32" cy="19" rx="4.6" ry="8.5" transform="rotate(315 32 32)"/>
  </g>
  <!-- сердцевина -->
  <circle cx="32" cy="32" r="5.6" fill="#e9e5ff"/>
  <circle cx="32" cy="32" r="3.2" fill="url(#petal)"/>
</svg>
